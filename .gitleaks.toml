title = "ELEVAPLUS Gestión: configuración de gitleaks"

[extend]
useDefault = true

# Solo falsos positivos verificados: valores de prueba o públicos por diseño.
# No agregar nada que pueda contener un secreto real.
# Se usa [allowlist] (singular) porque gitleaks 8.24, el del CI, no aplica [[allowlists]].
# Hallazgos puntuales de commits viejos (por fingerprint) van en .gitleaksignore.
#
# - .env.test: claves por defecto del stack local de Supabase (127.0.0.1); las usan los E2E
#   y la integración. Verificado por el usuario el 08/10/2026.
# - .env.staging: URL y anon key de staging, públicas por diseño (la protección es RLS).
#   Verificado por el usuario el 08/10/2026.
# - worker/src/http/auth.test.ts: valores ficticios de WORKER_SECRET.
# - tests/integracion/setup.ts: token de prueba del stack local de Supabase.

[allowlist]
description = "Valores de prueba o públicos por diseño, revisados"
paths = [
  '''^\.env\.test$''',
  '''^\.env\.staging$''',
  '''^worker/src/http/auth\.test\.ts$''',
  '''^tests/integracion/setup\.ts$''',
]
