title = "ELEVAPLUS Gestión: configuración de gitleaks"

[extend]
useDefault = true

# Solo falsos positivos verificados: valores de prueba o públicos por diseño.
# No agregar nada que pueda contener un secreto real.

# Hallazgos puntuales de commits viejos (por fingerprint) van en .gitleaksignore.

[[allowlists]]
description = "Claves por defecto del stack local de Supabase (127.0.0.1); las usan los E2E y la integración. Verificado por el usuario el 08/10/2026."
paths = ['''^\.env\.test$''']

[[allowlists]]
description = "URL y anon key de staging: públicas por diseño (la protección es RLS). Verificado por el usuario el 08/10/2026."
paths = ['''^\.env\.staging$''']
[[allowlists]]
description = "Valores ficticios de WORKER_SECRET en los tests del middleware de auth del worker"
paths = ['''^worker/src/http/auth\.test\.ts$''']

[[allowlists]]
description = "Token de prueba del stack local de Supabase en el setup de integración"
paths = ['''^tests/integracion/setup\.ts$''']
