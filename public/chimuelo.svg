<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo suave -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a3241" />
      <stop offset="100%" stop-color="#141821" />
    </radialGradient>

    <!-- Gradiente para la cabeza -->
    <radialGradient id="headGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#323a48" />
      <stop offset="70%" stop-color="#1e2430" />
      <stop offset="100%" stop-color="#12161f" />
    </radialGradient>

    <!-- Gradiente para los cuernos -->
    <linearGradient id="hornGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Gradiente de los ojos ámbar / dorados -->
    <radialGradient id="eyeGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
  </defs>

  <!-- Círculo de fondo que enmarca el avatar -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" />

  <!-- Cuernito / cresta central -->
  <path d="M57 20 Q60 14 63 20 L61 28 L59 28 Z" fill="#3b4455" stroke="#12161f" stroke-width="1" />

  <!-- Cuernos laterales pequeños y simpáticos -->
  <!-- Cuerno izquierdo -->
  <path d="M40 33 C34 23 37 17 41 16 C43 20 45 26 47 31 Z" fill="url(#hornGrad)" stroke="#12161f" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Cuerno derecho -->
  <path d="M80 33 C86 23 83 17 79 16 C77 20 75 26 73 31 Z" fill="url(#hornGrad)" stroke="#12161f" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Orejitas / aletitas laterales pequeñas y redondeadas -->
  <path d="M28 50 C20 48 21 42 27 45 C30 47 32 50 33 53 Z" fill="#242b38" stroke="#12161f" stroke-width="1" />
  <path d="M92 50 C100 48 99 42 93 45 C90 47 88 50 87 53 Z" fill="#242b38" stroke="#12161f" stroke-width="1" />

  <!-- Cuello / hombros -->
  <path d="M38 92 C38 78 50 74 60 74 C70 74 82 78 82 92 C82 108 38 108 38 92 Z" fill="#181d26" />

  <!-- Cabeza redonda y simpática -->
  <ellipse cx="60" cy="56" rx="33" ry="29" fill="url(#headGrad)" stroke="#12161f" stroke-width="1.5" />

  <!-- Cachetes redonditos (rubor sutil ámbar) -->
  <ellipse cx="37" cy="64" rx="6" ry="3.5" fill="#f59e0b" opacity="0.22" />
  <ellipse cx="83" cy="64" rx="6" ry="3.5" fill="#f59e0b" opacity="0.22" />

  <!-- Ojo izquierdo (Ámbar / Dorado) -->
  <g id="ojoIzquierdo">
    <ellipse cx="45" cy="53" rx="8.5" ry="10" fill="url(#eyeGrad)" stroke="#12161f" stroke-width="1.2" />
    <!-- Pupila redonda y amigable -->
    <ellipse cx="46" cy="53" rx="5" ry="6.5" fill="#111827" />
    <!-- Brillo principal -->
    <circle cx="44" cy="50" r="2.5" fill="#ffffff" />
    <!-- Brillo secundario pequeño -->
    <circle cx="48" cy="55.5" r="1.1" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Ojo derecho (Ámbar / Dorado) -->
  <g id="ojoDerecho">
    <ellipse cx="75" cy="53" rx="8.5" ry="10" fill="url(#eyeGrad)" stroke="#12161f" stroke-width="1.2" />
    <!-- Pupila redonda y amigable -->
    <ellipse cx="74" cy="53" rx="5" ry="6.5" fill="#111827" />
    <!-- Brillo principal -->
    <circle cx="72" cy="50" r="2.5" fill="#ffffff" />
    <!-- Brillo secundario pequeño -->
    <circle cx="76" cy="55.5" r="1.1" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Naricita / hocico simpático -->
  <circle cx="56.5" cy="63" r="1.3" fill="#111827" />
  <circle cx="63.5" cy="63" r="1.3" fill="#111827" />

  <!-- Sonrisa dulce y amigable -->
  <path d="M51 68 Q60 76 69 68" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
  <!-- Hoyuelos sutiles en la comisura -->
  <path d="M49 67 Q50 69 51 68" fill="none" stroke="#eab308" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
  <path d="M71 67 Q70 69 69 68" fill="none" stroke="#eab308" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />

  <!-- Pequeño diente redondeado y simpático asomando -->
  <path d="M58 72 Q60 75 62 72 Z" fill="#ffffff" opacity="0.9" />

  <!-- Crestas dorsales pequeñas en el cuello -->
  <polygon points="60,94 62,99 58,99" fill="#eab308" opacity="0.8" />
  <polygon points="60,103 62,108 58,108" fill="#eab308" opacity="0.8" />
</svg>
