<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Chofer — Servicio no planificado — ELEVAPLUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-color: #f5f7fa;
        font-family:
          "IBM Plex Sans",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #17212b;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
      }
      .mobile-frame {
        width: 100%;
        max-width: 390px;
        background-color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        border-left: 1px solid #d9e0e8;
        border-right: 1px solid #d9e0e8;
      }
      /* Top Header */
      .top-header {
        height: 56px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #d9e0e8;
        background: #ffffff;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .header-title {
        font-size: 16px;
        font-weight: 600;
        color: #17212b;
      }
      .cancel-link {
        font-size: 14px;
        font-weight: 500;
        color: #5b6b7b;
        text-decoration: none;
        padding: 8px 4px;
      }
      .cancel-link:hover {
        color: #b91c1c;
      }

      .content {
        padding: 16px;
        flex: 1;
        padding-bottom: 120px;
      }

      .field-group {
        margin-bottom: 20px;
      }
      .field-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #17212b;
        margin-bottom: 8px;
      }

      /* Buscador cliente */
      .search-input-box {
        position: relative;
        margin-bottom: 8px;
      }
      .search-input {
        width: 100%;
        height: 48px;
        border: 1px solid #d9e0e8;
        border-radius: 6px;
        padding: 0 14px 0 40px;
        font-size: 15px;
        font-family: inherit;
        color: #17212b;
        background: #ffffff;
        outline: none;
      }
      .search-input:focus {
        border-color: #1e4fa8;
        box-shadow: 0 0 0 2px rgba(30, 79, 168, 0.2);
      }
      .search-icon {
        position: absolute;
        left: 12px;
        top: 14px;
        width: 20px;
        height: 20px;
        stroke: #8d9aa8;
        fill: none;
        stroke-width: 2;
      }
      .client-list {
        background: #ffffff;
        border: 1px solid #d9e0e8;
        border-radius: 6px;
        overflow: hidden;
      }
      .client-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid #d9e0e8;
        font-size: 14px;
        cursor: pointer;
        background: #ffffff;
      }
      .client-item:active,
      .client-item.selected {
        background: #e6edf9;
        color: #1e4fa8;
        font-weight: 500;
      }
      .client-item:last-child {
        border-bottom: none;
      }
      .new-client-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        color: #1e4fa8;
        font-size: 14px;
        font-weight: 500;
        background: #f5f7fa;
        cursor: pointer;
      }
      .new-client-item svg {
        width: 18px;
        height: 18px;
        stroke: #1e4fa8;
        stroke-width: 2;
      }

      /* Grilla 2x2 tipo de servicio */
      .type-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .type-btn {
        height: 56px;
        border: 1px solid #d9e0e8;
        border-radius: 6px;
        background: #ffffff;
        color: #17212b;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        padding: 4px 8px;
      }
      .type-btn.active {
        border-color: #1e4fa8;
        background: #e6edf9;
        color: #1e4fa8;
        font-weight: 600;
      }

      /* Foto area */
      .photo-dropzone {
        height: 110px;
        border: 2px dashed #d9e0e8;
        border-radius: 8px;
        background: #f5f7fa;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        color: #1e4fa8;
        font-size: 14px;
        font-weight: 500;
      }
      .photo-dropzone svg {
        width: 28px;
        height: 28px;
        stroke: #1e4fa8;
        fill: none;
        stroke-width: 2;
      }
      .thumb-preview {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        margin-top: 8px;
        background: #f5f7fa;
        border: 1px solid #d9e0e8;
        border-radius: 6px;
      }
      .thumb-img {
        width: 44px;
        height: 44px;
        border-radius: 4px;
        object-fit: cover;
        border: 1px solid #d9e0e8;
        background: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .thumb-info {
        flex: 1;
      }
      .thumb-name {
        font-size: 13px;
        font-weight: 500;
        color: #17212b;
      }
      .thumb-size {
        font-size: 11px;
        color: #5b6b7b;
      }
      .thumb-check {
        color: #15803d;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* Botón secundario nota de voz */
      .voice-btn {
        width: 100%;
        height: 44px;
        border: 1px solid #d9e0e8;
        background: #ffffff;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        color: #17212b;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 14px;
        cursor: pointer;
      }
      .voice-btn svg {
        width: 18px;
        height: 18px;
        stroke: #5b6b7b;
        fill: none;
        stroke-width: 2;
      }

      /* Footer sticky */
      .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 390px;
        background: #ffffff;
        border-top: 1px solid #d9e0e8;
        padding: 12px 16px 16px;
        box-shadow: 0 -4px 12px rgba(23, 33, 43, 0.06);
      }
      .bottom-hint {
        text-align: center;
        font-size: 12px;
        color: #5b6b7b;
        margin-bottom: 8px;
      }
      .primary-btn {
        width: 100%;
        height: 56px;
        background: #1e4fa8;
        border: none;
        border-radius: 6px;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .primary-btn:active {
        background: #163b7d;
      }
    </style>
  </head>
  <body>
    <div class="mobile-frame">
      <!-- Header -->
      <header class="top-header">
        <div class="header-title">Servicio no planificado</div>
        <a href="#" class="cancel-link">Cancelar</a>
      </header>

      <!-- Main Content -->
      <div class="content">
        <!-- Campo 1: Cliente -->
        <div class="field-group">
          <label class="field-label">Cliente</label>
          <div class="search-input-box">
            <svg class="search-icon" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="text"
              class="search-input"
              value="Huma S.A."
              placeholder="Buscar o elegir cliente"
            />
          </div>
          <div class="client-list">
            <div class="client-item selected">
              <span>Huma S.A.</span>
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#1E4FA8"
                stroke-width="2.5"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </div>
            <div class="client-item">
              <span>Deza S.A.</span>
            </div>
            <div class="client-item">
              <span>Carpas D'Angiola</span>
            </div>
            <div class="new-client-item">
              <svg viewBox="0 0 24 24" fill="none">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              <span>Cliente nuevo: escribir nombre</span>
            </div>
          </div>
        </div>

        <!-- Campo 2: Tipo de servicio (2x2) -->
        <div class="field-group">
          <label class="field-label">Tipo de servicio</label>
          <div class="type-grid">
            <button class="type-btn active">Traslado</button>
            <button class="type-btn">Alquiler por hora</button>
            <button class="type-btn">Mantenimiento</button>
            <button class="type-btn">Otro</button>
          </div>
        </div>

        <!-- Campo 3: Foto del remito -->
        <div class="field-group">
          <label class="field-label">Foto del remito</label>
          <div class="photo-dropzone">
            <svg viewBox="0 0 24 24">
              <path
                d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
              />
              <circle cx="12" cy="13" r="4" />
            </svg>
            <span>Sacar foto del remito</span>
          </div>

          <!-- Miniatura ya cargada -->
          <div class="thumb-preview">
            <div class="thumb-img">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#1E4FA8"
                stroke-width="2"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                />
                <polyline points="14 2 14 8 20 8" />
              </svg>
            </div>
            <div class="thumb-info">
              <div class="thumb-name">remito_manual_0042.jpg</div>
              <div class="thumb-size">1,4 MB · Foto adjunta</div>
            </div>
            <div class="thumb-check">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
              Listo
            </div>
          </div>

          <!-- Botón opcional: Grabar nota de voz -->
          <button class="voice-btn">
            <svg viewBox="0 0 24 24">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
              <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
              <line x1="12" y1="19" x2="12" y2="23" />
              <line x1="8" y1="23" x2="16" y2="23" />
            </svg>
            Grabar nota de voz
          </button>
        </div>
      </div>

      <!-- Sticky Bottom -->
      <div class="bottom-bar">
        <div class="bottom-hint">
          La oficina completa el precio y los datos después.
        </div>
        <button class="primary-btn">Guardar</button>
      </div>
    </div>
  </body>
</html>
