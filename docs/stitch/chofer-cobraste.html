<!doctype html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      @layer base {
        html,
        body {
          width: 100vw;
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary-fixed-variant": "#04429b",
              primary: "#003887",
              "inverse-on-surface": "#e8f2ff",
              outline: "#737783",
              tinta: "#17212B",
              "on-tertiary": "#ffffff",
              "surface-bright": "#f7f9ff",
              "ok-suave": "#E4F5EA",
              "primary-fixed": "#d9e2ff",
              "tertiary-container": "#8b3c00",
              "surface-container-low": "#edf4ff",
              "on-tertiary-fixed": "#331200",
              superficie: "#FFFFFF",
              "primary-container": "#1e4fa8",
              "surface-container-highest": "#d9e3f1",
              "secondary-fixed-dim": "#b8c8db",
              "on-primary-fixed": "#001945",
              "error-container": "#ffdad6",
              "alerta-suave": "#FDF0E0",
              "tinta-suave": "#5B6B7B",
              "surface-container": "#e4effd",
              alerta: "#B45309",
              "on-primary-container": "#b2c7ff",
              "surface-container-lowest": "#ffffff",
              "marca-suave": "#E6EDF9",
              "on-background": "#121c26",
              "on-surface": "#121c26",
              marca: "#1E4FA8",
              tertiary: "#672b00",
              fondo: "#F5F7FA",
              "on-error-container": "#93000a",
              "marca-oscuro": "#163B7D",
              peligro: "#B91C1C",
              "peligro-suave": "#FBE9E9",
              error: "#ba1a1a",
              surface: "#f7f9ff",
              "on-tertiary-fixed-variant": "#773200",
              "primary-fixed-dim": "#b0c6ff",
              "on-primary": "#ffffff",
              "on-error": "#ffffff",
              "tertiary-fixed": "#ffdbca",
              "on-surface-variant": "#434652",
              secondary: "#506070",
              "inverse-surface": "#27313c",
              "secondary-container": "#d1e1f4",
              "inverse-primary": "#b0c6ff",
              "surface-tint": "#2d5bb4",
              "on-secondary-fixed": "#0c1d2a",
              "surface-container-high": "#dfe9f7",
              "tinta-tenue": "#8D9AA8",
              "on-secondary-container": "#546474",
              ok: "#15803D",
              "surface-dim": "#d1dbe9",
              "tertiary-fixed-dim": "#ffb68f",
              "on-secondary": "#ffffff",
              borde: "#D9E0E8",
              "outline-variant": "#c3c6d4",
              "on-tertiary-container": "#ffb892",
              "secondary-fixed": "#d4e4f7",
              background: "#f7f9ff",
              "on-secondary-fixed-variant": "#394857",
              "surface-variant": "#d9e3f1",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              "space-16": "1rem",
              "page-padding-mobile": "1rem",
              "space-12": "0.75rem",
              "max-width-desktop": "1280px",
              "space-8": "0.5rem",
              "space-20": "1.25rem",
              "page-padding-desktop": "2rem",
              "space-32": "2rem",
              "space-4": "0.25rem",
              "space-48": "3rem",
              "space-24": "1.5rem",
            },
            fontFamily: {
              "headline-md": ["IBM Plex Sans"],
              "headline-lg": ["IBM Plex Sans"],
              caption: ["IBM Plex Sans"],
              "body-default": ["IBM Plex Sans"],
              "headline-xl": ["IBM Plex Sans"],
              "caption-medium": ["IBM Plex Sans"],
              "body-md": ["IBM Plex Sans"],
              "label-mobile-nav": ["IBM Plex Sans"],
            },
            fontSize: {
              "headline-md": [
                "18px",
                { lineHeight: "24px", fontWeight: "600" },
              ],
              "headline-lg": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              caption: ["12px", { lineHeight: "16px", fontWeight: "400" }],
              "body-default": [
                "14px",
                { lineHeight: "20px", fontWeight: "400" },
              ],
              "headline-xl": [
                "30px",
                { lineHeight: "38px", fontWeight: "600" },
              ],
              "caption-medium": [
                "12px",
                { lineHeight: "16px", fontWeight: "500" },
              ],
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "500" }],
              "label-mobile-nav": [
                "11px",
                { lineHeight: "14px", fontWeight: "500" },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-fondo text-tinta font-body-default flex flex-col min-h-screen"
  >
    <header
      class="fixed top-0 w-full z-50 pt-safe bg-superficie shadow-[0_1px_8px_rgba(23,33,43,0.06)]"
    >
      <div
        class="h-14 px-page-padding-mobile flex items-center justify-between"
      >
        <div class="flex items-center gap-space-8">
          <img
            alt="ELEVAPLUS Logo"
            class="h-8 w-auto object-contain"
            src="https://lh3.googleusercontent.com/aida/AEtjO1W90fa3U6s2VQkNz3JufHW8h11M989zxY4b__Dbtz1YzpoFpIIyeB-riwve4w73HU_HdMV_pVFItkoor0UC3nmJISsUH0IOcfwr2HlKOZt7DblnR_zpoexGEzZtvUAQlEzGq6hg8AEVSXI3aislc5DvWg6TrLQeR6GjcMIWznmnLhbhwZae4OW03eUx6Xdelye1PM--M5VQEGPdGMPAQWKxLlPuBI0vZei46DxtksuOrYF7NPi0YCT0wsy0"
          /><span class="hidden">Driver Active Job</span>
        </div>
        <div class="flex items-center gap-space-8">
          <div class="flex items-center gap-space-8 pl-space-8">
            <span class="font-body-md text-body-md text-tinta">Mauro</span>
            <div
              class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"
            >
              <span
                class="material-symbols-outlined text-on-primary text-[18px]"
                >person</span
              >
            </div>
          </div>
          <button
            aria-label="Cerrar sesión"
            class="w-11 h-11 flex items-center justify-center text-tinta-suave hover:text-peligro transition-colors"
          >
            <span class="material-symbols-outlined text-[22px]">logout</span>
          </button>
        </div>
      </div>
    </header>
    <main
      class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-fondo px-page-padding-mobile"
    >
      <div class="flex flex-col w-full max-w-[390px] mx-auto pb-6 select-none">
        <!-- Progress Header Context -->
        <div class="flex items-center justify-between py-space-8 mb-space-12">
          <div class="flex items-center gap-space-8">
            <span
              class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-ok-suave text-ok text-[14px]"
            >
              <span class="material-symbols-outlined text-[16px]">check</span>
            </span>
            <span
              class="font-caption-medium text-caption-medium text-ok uppercase tracking-wider"
              >Servicio finalizado</span
            >
          </div>
          <span class="font-caption text-caption text-tinta-tenue"
            >Paso 2 de 2</span
          >
        </div>
        <!-- Header Card -->
        <div
          class="bg-superficie rounded-xl p-space-16 mb-space-16 shadow-sm flex items-start justify-between"
        >
          <div>
            <h1
              class="font-headline-lg text-headline-lg text-tinta font-semibold leading-tight mb-space-4"
            >
              ¿Cobraste?
            </h1>
            <p class="font-body-default text-body-default text-tinta-suave">
              Servicio #1042 · Huma S.A.
            </p>
          </div>
          <div
            class="w-10 h-10 rounded-full bg-marca-suave flex items-center justify-center text-marca flex-shrink-0"
          >
            <span class="material-symbols-outlined text-[24px]">payments</span>
          </div>
        </div>
        <!-- Form Wrapper -->
        <form
          class="flex flex-col gap-space-16"
          id="payment-form"
          onsubmit="event.preventDefault()"
        >
          <!-- Payment Options Group -->
          <div
            aria-label="Modalidad de cobro"
            class="flex flex-col gap-space-8"
            role="radiogroup"
          >
            <!-- Option 1: No, lo paga después -->
            <button
              class="payment-option w-full h-14 px-space-16 rounded-lg bg-superficie flex items-center justify-between text-left transition-all active:scale-[0.99] shadow-sm"
              data-option="later"
              id="btn-later"
              onclick="selectOption('later')"
              type="button"
            >
              <div class="flex items-center gap-space-12">
                <span
                  class="material-symbols-outlined text-[22px] text-tinta-suave option-icon"
                  >pending_actions</span
                >
                <span
                  class="font-body-md text-body-md text-tinta font-medium label-text"
                  >No, lo paga después</span
                >
              </div>
              <div
                class="w-5 h-5 rounded-full bg-surface-container flex items-center justify-center radio-circle"
              >
                <div
                  class="w-2.5 h-2.5 rounded-full bg-transparent radio-dot"
                ></div>
              </div>
            </button>
            <!-- Option 2: Efectivo (Active by default) -->
            <button
              class="payment-option active w-full h-14 px-space-16 rounded-lg bg-marca-suave flex items-center justify-between text-left transition-all active:scale-[0.99] shadow-sm"
              data-option="cash"
              id="btn-cash"
              onclick="selectOption('cash')"
              type="button"
            >
              <div class="flex items-center gap-space-12">
                <span
                  class="material-symbols-outlined text-[22px] text-marca option-icon"
                  >point_of_sale</span
                >
                <span
                  class="font-body-md text-body-md text-marca font-semibold label-text"
                  >Efectivo</span
                >
              </div>
              <div
                class="w-5 h-5 rounded-full bg-marca flex items-center justify-center radio-circle"
              >
                <div class="w-2 h-2 rounded-full bg-superficie radio-dot"></div>
              </div>
            </button>
            <!-- Option 3: Cheque -->
            <button
              class="payment-option w-full h-14 px-space-16 rounded-lg bg-superficie flex items-center justify-between text-left transition-all active:scale-[0.99] shadow-sm"
              data-option="check"
              id="btn-check"
              onclick="selectOption('check')"
              type="button"
            >
              <div class="flex items-center gap-space-12">
                <span
                  class="material-symbols-outlined text-[22px] text-tinta-suave option-icon"
                  >description</span
                >
                <span
                  class="font-body-md text-body-md text-tinta font-medium label-text"
                  >Cheque</span
                >
              </div>
              <div
                class="w-5 h-5 rounded-full bg-surface-container flex items-center justify-center radio-circle"
              >
                <div
                  class="w-2.5 h-2.5 rounded-full bg-transparent radio-dot"
                ></div>
              </div>
            </button>
          </div>
          <!-- Conditional Amount Input Section -->
          <div
            class="flex flex-col gap-space-8 transition-opacity duration-200"
            id="amount-section"
          >
            <label
              class="font-body-md text-body-md text-tinta-suave font-medium pl-space-4"
              for="amount-input"
            >
              Monto recibido
            </label>
            <div
              class="relative w-full h-14 rounded-lg bg-superficie shadow-sm flex items-center px-space-16 focus-within:ring-2 focus-within:ring-marca"
            >
              <span
                class="font-headline-md text-headline-md text-tinta-suave font-medium mr-space-8 select-none"
                >$</span
              >
              <input
                class="w-full bg-transparent font-headline-md text-headline-md font-semibold text-tinta tracking-tight tabular-nums outline-none placeholder:text-tinta-tenue"
                id="amount-input"
                inputmode="numeric"
                placeholder="0"
                type="text"
                value="320.000"
              />
              <button
                aria-label="Borrar monto"
                class="p-space-4 text-tinta-tenue hover:text-tinta active:scale-95"
                onclick="
                  document.getElementById('amount-input').value = '';
                  document.getElementById('amount-input').focus();
                "
                type="button"
              >
                <span class="material-symbols-outlined text-[20px]"
                  >cancel</span
                >
              </button>
            </div>
          </div>
          <!-- Receipt Photo Attachment Component -->
          <div
            class="flex flex-col gap-space-8 transition-opacity duration-200"
            id="receipt-section"
          >
            <button
              class="w-full h-14 px-space-16 rounded-lg bg-superficie hover:bg-fondo active:bg-surface-container text-tinta font-body-md text-body-md font-medium flex items-center justify-center gap-space-8 shadow-sm transition-all"
              id="photo-trigger-btn"
              onclick="handlePhotoAction()"
              type="button"
            >
              <span class="material-symbols-outlined text-[22px] text-marca"
                >photo_camera</span
              >
              <span id="photo-btn-label">Sacar foto del comprobante</span>
            </button>
            <!-- Attached File Indicator -->
            <div
              class="flex items-center gap-space-8 px-space-8 py-space-4 bg-ok-suave/60 rounded-lg"
              id="file-indicator"
            >
              <span
                class="material-symbols-outlined text-ok text-[18px]"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >check_circle</span
              >
              <span
                class="font-caption text-caption text-tinta flex-1 truncate"
              >
                1 foto adjunta:
                <span class="font-medium text-ok font-mono"
                  >remito_cobro_huma.jpg</span
                >
              </span>
              <button
                aria-label="Quitar foto"
                class="text-tinta-suave hover:text-peligro p-space-4 flex items-center"
                onclick="removeAttachedPhoto()"
                type="button"
              >
                <span class="material-symbols-outlined text-[16px]">close</span>
              </button>
            </div>
          </div>
          <!-- Sticky Operational Footer Button -->
          <div class="pt-space-16 mt-space-8">
            <button
              class="w-full h-14 bg-marca hover:bg-marca-oscuro active:scale-[0.99] text-superficie rounded-lg font-headline-md text-headline-md font-semibold flex items-center justify-center gap-space-8 shadow-md transition-all"
              id="submit-btn"
              onclick="finalizeDelivery()"
              type="submit"
            >
              <span>Listo</span>
              <span class="material-symbols-outlined text-[22px]"
                >arrow_forward</span
              >
            </button>
            <p
              class="font-caption text-caption text-tinta-tenue text-center mt-space-8"
            >
              Al guardar, el servicio queda registrado y notifica a despacho.
            </p>
          </div>
        </form>
      </div>
      <script>
        let currentSelection = "cash";
        let photoAttached = true;

        function selectOption(option) {
          currentSelection = option;
          const options = ["later", "cash", "check"];
          const amountSection = document.getElementById("amount-section");
          const receiptSection = document.getElementById("receipt-section");

          options.forEach((opt) => {
            const btn = document.getElementById("btn-" + opt);
            const icon = btn.querySelector(".option-icon");
            const label = btn.querySelector(".label-text");
            const circle = btn.querySelector(".radio-circle");
            const dot = btn.querySelector(".radio-dot");

            if (opt === option) {
              btn.className =
                "payment-option active w-full h-14 px-space-16 rounded-lg bg-marca-suave flex items-center justify-between text-left transition-all active:scale-[0.99] shadow-sm ring-2 ring-marca";
              icon.className =
                "material-symbols-outlined text-[22px] text-marca option-icon";
              label.className =
                "font-body-md text-body-md text-marca font-semibold label-text";
              circle.className =
                "w-5 h-5 rounded-full bg-marca flex items-center justify-center radio-circle";
              dot.className = "w-2 h-2 rounded-full bg-superficie radio-dot";
            } else {
              btn.className =
                "payment-option w-full h-14 px-space-16 rounded-lg bg-superficie flex items-center justify-between text-left transition-all active:scale-[0.99] shadow-sm";
              icon.className =
                "material-symbols-outlined text-[22px] text-tinta-suave option-icon";
              label.className =
                "font-body-md text-body-md text-tinta font-medium label-text";
              circle.className =
                "w-5 h-5 rounded-full bg-surface-container flex items-center justify-center radio-circle";
              dot.className =
                "w-2.5 h-2.5 rounded-full bg-transparent radio-dot";
            }
          });

          if (option === "later") {
            amountSection.classList.add("hidden");
            receiptSection.classList.add("hidden");
          } else {
            amountSection.classList.remove("hidden");
            receiptSection.classList.remove("hidden");
          }
        }

        function handlePhotoAction() {
          const indicator = document.getElementById("file-indicator");
          indicator.classList.remove("hidden");
          photoAttached = true;
        }

        function removeAttachedPhoto() {
          const indicator = document.getElementById("file-indicator");
          indicator.classList.add("hidden");
          photoAttached = false;
        }

        function finalizeDelivery() {
          const btn = document.getElementById("submit-btn");
          btn.innerHTML =
            '<span class="material-symbols-outlined animate-spin text-[22px]">progress_activity</span><span>Guardando...</span>';
          btn.disabled = true;
          setTimeout(() => {
            btn.innerHTML =
              '<span class="material-symbols-outlined text-[22px]">check</span><span>¡Servicio cerrado!</span>';
            btn.className =
              "w-full h-14 bg-ok text-superficie rounded-lg font-headline-md text-headline-md font-semibold flex items-center justify-center gap-space-8 shadow-md transition-all";
          }, 600);
        }

        // Format currency on input
        const amountInput = document.getElementById("amount-input");
        amountInput.addEventListener("input", (e) => {
          let raw = e.target.value.replace(/\D/g, "");
          if (!raw) {
            e.target.value = "";
            return;
          }
          e.target.value = new Intl.NumberFormat("es-AR").format(raw);
        });
      </script>
    </main>
  </body>
</html>
